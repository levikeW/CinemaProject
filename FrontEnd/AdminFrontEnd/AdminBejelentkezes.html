<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="AdminCinema.css"/>
    <title>Bejelentkezés / Regisztráció</title>
</head>
<body class="auth-page">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="AdminCinema.html">
                <img src="Logo.png" alt="Logo" height="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCinema">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCinema">
                <form class="d-flex ms-3">
                    <input class="form-control me-2" type="search" placeholder="Keresés">
                    <button class="btn btn-outline-success" type="submit">Keresés</button>
                </form>
                <ul class="navbar-nav ms-auto" id="navProfileArea">
                    <li class="nav-item"><a class="nav-link" href="AdminCinema.html">Főoldal</a></li>                    
                    <li class="nav-item"><a class="nav-link" href="AdminFilmek.html">Filmek</a></li>
                    <li class="nav-item"><a class="nav-link" href="AdminArak.html">Árak</a></li>
                    <li class="nav-item"><a class="nav-link" href="AdminTermek.html">Termek</a></li>
                    <li class="nav-item"><a class="nav-link" href="AdminKategoriak.html">Kategóriák</a></li>
                    <li class="nav-item"><a class="nav-link" href="AdminRolunk.html">Rólunk</a></li>
                    <li class="nav-item"><a class="nav-link active" href="AdminBejelentkezes.html">Bejelentkezés/Regisztráció</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <ul class="nav nav-tabs mb-4" role="tablist">
            <li class="nav-item" role="presentation">
                <button id="loginTab" class="nav-link active" data-bs-toggle="tab" data-bs-target="#loginForm" type="button">
                    Bejelentkezés
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#registerTabPane" type="button">
                    Regisztráció
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="loginForm" role="tabpanel">
                <div id="loginMessage"></div>
                <form onsubmit="Admin_handleLoginSubmit(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email cím:</label>
                        <input type="email" id="loginEmail" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Jelszó:</label>
                        <input type="password" id="loginPassword" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Bejelentkezés</button>
                </form>
            </div>


            <div class="tab-pane fade" id="registerTabPane" role="tabpanel">
                <div id="registerMessage"></div>
                <form id="registerForm" onsubmit="Admin_handleRegisterSubmit(event)">
                    <div class="form-group">
                        <label for="registerEmail">Email cím:</label>
                        <input type="email" id="registerEmail" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="registerFullName">Teljes név:</label>
                        <input type="text" id="registerFullName" name="fullName" required>
                    </div>

                    <div class="form-group">
                        <label for="registerAddress">Lakcím:</label>
                        <input type="text" id="registerAddress" name="address" required>
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Jelszó:</label>
                        <input type="password" id="registerPassword" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="registerPasswordConfirm">Jelszó megerősítés:</label>
                        <input type="password" id="registerPasswordConfirm" name="passwordConfirm" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Regisztráció</button>
                </form>
            </div>
        </div>
    </div>
    <script src="Script/adminApi.js"></script>
    <script src="Script/adminCinema.js"></script>
</body>
</html>
