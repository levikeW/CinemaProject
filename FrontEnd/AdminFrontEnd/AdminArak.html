<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="AdminCinema.css" />
    <title>Admin - Jegyárak</title>
</head>

<body class="arak-page">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="AdminCinema.html">
                <img src="Logo.png" alt="Logo" height="50">
            </a>
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarCinema">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCinema">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="navProfileArea">

                    <li class="nav-item">
                        <a class="nav-link" href="AdminCinema.html">Főoldal</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="AdminArak.html">Árak</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="AdminKategoriak.html">Kategóriák</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="AdminRolunk.html">Rólunk</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="AdminBejelentkezes.html">Bejelentkezés</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="Arakall page-section">
        <section class="arak-hero">
            <h1 class="Arakh1">
                Jegyárak kezelése
            </h1>
            <p class="arak-lead">
                Admin felület a jegytípusok létrehozásához, módosításához és törléséhez.
            </p>
        </section>

        <section class="Arakkeret kartya arak-panel"> 
            
            <!-- JEGY LISTA -->

            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Jegytípus</th>
                        <th>Ár (Ft)</th>
                        <th>Művelet</th>
                    </tr>
                </thead>
                <tbody id="adminTicketsTbody">
                    <tr>
                        <td colspan="4" class="text-center">
                            <div class="spinner-border spinner-border-sm"></div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- ÚJ JEGY -->

            <div class="mb-4">
                <h4>Új jegytípus létrehozása</h4>
                <div id="adminTicketMessage"></div>
                <form id="ticketForm" onsubmit="handleTicketCreate(event)">
                    <div class="mb-2">
                        <label class="form-label">
                            Jegytípus
                        </label>
                        <input
                            type="text"
                            id="ticketType"
                            class="form-control"
                            required>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">
                            Ár (Ft)
                        </label>
                        <input
                            type="number"
                            id="ticketPrice"
                            class="form-control"
                            required>
                    </div>
                    <button class="btn btn-success mt-2">
                        Jegytípus létrehozása
                    </button>
                </form>
            </div>

            <!-- MÓDOSÍTÁS -->

            <div class="mt-4">
                <h4>Jegytípus módosítása</h4>
                <div id="adminTicketEditMessage"></div>
                <form onsubmit="handleTicketUpdate(event)">
                    <input type="hidden" id="editTicketId">
                    <div class="mb-2">
                        <label class="form-label">
                            Jegytípus
                        </label>
                        <input
                            type="text"
                            id="editTicketType"
                            class="form-control">
                    </div>
                    <div class="mb-2">
                        <label class="form-label">
                            Ár
                        </label>
                        <input
                            type="number"
                            id="editTicketPrice"
                            class="form-control">
                    </div>

                    <button class="btn btn-warning mt-2">
                        Módosítás mentése
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2025 CineMánia Admin
    </footer>

    <script src="Script/adminCinema.js"></script>
</body>
</html>
