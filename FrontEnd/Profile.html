<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="Cinema.css"/>
    <title>Profil</title>
</head>
<body class="profile-page">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="Cinema.html">
                <img src="Logo.png" alt="Logo" height="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCinema">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCinema">
                <form class="d-flex ms-3">
                    <input class="form-control me-2 site-search-input" type="search" placeholder="Keresés">
                </form>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="navProfileArea">
                    <li class="nav-item"><a class="nav-link" href="Cinema.html">Főoldal</a></li>
                    <li class="nav-item"><a class="nav-link" href="Arak.html">Árak</a></li>
                    <li class="nav-item"><a class="nav-link" href="Kategoriak.html">Kategóriák</a></li>
                    <li class="nav-item"><a class="nav-link" href="Rolunk.html">Rólunk</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Bejelentkezes.html">Bejelentkezés/Regisztráció</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="container py-5" id="profileContainer">
        <h1>Profil</h1>
        <div id="profileMessage" class="alert alert-success"></div>
        <form id="profileForm" onsubmit="handleProfileSave(event)">
            <div class="form-group">
                <label for="profileEmail">Email:</label>
                <input type="email" id="profileEmail" name="profileEmail" placeholder="Add meg az email címed">
            </div>
            <div class="form-group">
                <label for="profileFullName">Teljes név:</label>
                <input type="text" id="profileFullName" name="profileFullName" placeholder="Add meg a teljes neved">
            </div>
            <div class="form-group">
                <label for="profileBilling">Számlázási cím:</label>
                <input type="text" id="profileBilling" name="profileBilling" placeholder="Add meg a számlázási címed">
            </div>
            <div class="profile-btn-group">
                <button type="submit" class="btn btn-primary btn-short">Mentés</button>
                <a class="btn btn-save-like btn-short" href="Foglalasok.html">Foglalásaim</a>
                <button type="button" class="btn btn-secondary btn-short" onclick="handleLogout();">Kijelentkezés</button>
            </div>
        </form>
    </div>

    <script src="Script/cinema.js"></script>
</body>
</html>
