<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="AdminCinema.css"/>
    <title>Cinema Project</title>
</head>
<body class="cinema-page">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="AdminCinema.html"><img src="Logo.png" alt="Logo" height="50"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCinema" aria-controls="navbarCinema" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCinema">
                <form class="d-flex ms-3">
                    <input class="form-control me-2" type="search" placeholder="Keresés" aria-label="Keresés">
                    <button class="btn btn-outline-success" type="submit">Keresés</button>
                </form>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0" id="navProfileArea">
                    <li class="nav-item"><a class="nav-link active" href="AdminCinema.html">Főoldal</a></li>
                    <li class="nav-item"><a class="nav-link" href="AdminArak.html">Árak</a></li>
                    <li class="nav-item"><a class="nav-link" href="AdminKategoriak.html">Kategóriák</a></li>
                    <li class="nav-item"><a class="nav-link" href="AdminRolunk.html">Rólunk</a></li>
                    <li class="nav-item"><a class="nav-link" href="AdminBejelentkezes.html">Bejelentkezés/Regisztráció</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="Fooldalall page-section">
        <section class="home-hero">
            <h1>Válassz filmet a következő esti programodhoz</h1>
            <p class="home-lead">Böngészd az aktuális vetítéseket, szűrj tetszésed szerint.</p>
        </section>

        <section class="filters">
            <label>
                Terem:
                <select id="locationFilter">
                    <option value="">Összes terem</option>
                    <option value="1">Morgan Freeman terem</option>
                    <option value="2">Meryl Streep terem</option>
                    <option value="3">Leonardo DiCaprio terem</option>
                </select>
            </label>
            <label>
                Kategóriára szűrés:
                <select id="genreFilter">
                    <option value="">Összes kategória</option>
                </select>
            </label>
            <label>
                Film kiválasztása:
                <select id="movieFilter">
                    <option value="">Összes film</option>
                </select>
            </label>
            <label>
                Dátum kiválasztás:
                <input type="date" id="dateFilter">
            </label>
        </section>

        <section class="movie-list" id="movieList">
            <div class="text-center py-5">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Betöltés...</span>
                </div>
            </div>
        </section>
    </main>

    <script src="Script/adminCinema.js"></script>
    <footer>
        &copy; 2025 Filmes oldal
    </footer>
</body>
</html>
