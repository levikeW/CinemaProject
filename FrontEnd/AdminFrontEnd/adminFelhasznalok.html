        <button class="navbar-toggler"
                type="button"

        </button>

        <div class="collapse navbar-collapse" id="navbarCinema">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="AdminCinema.html">Főoldal</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="AdminFilmek.html">Filmek</a>

                <li class="nav-item">

                <li class="nav-item">

</header>

<main class="admin-page page-section">

    <section class="admin-hero">
        <h1 class="admin-title">Felhasználók kezelése</h1>
        <p class="admin-lead">
            Felhasználók törlése és szerepkör módosítása.
        </p>
    </section>

    <!-- TÁBLA -->
    <section class="container py-4">
        <div class="card admin-card shadow-sm">
            <div class="card-header">
                <h4 class="mb-0">Felhasználók listája</h4>
            </div>

            <div class="card-body">

                <div id="adminUserMessage" class="mb-3"></div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">

                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Email</th>
                            <th>Teljes név</th>
                            <th>Cím</th>
                            <th>Szerepkör</th>
                            <th>Művelet</th>
                        </tr>
                        </thead>

                        <tbody id="adminUsersTbody">
                        <tr>
                            <td colspan="6" class="text-center">
                                <div class="spinner-border spinner-border-sm" role="status">
                                    <span class="visually-hidden">Betöltés...</span>
                                </div>
                            </td>
                        </tr>
                        </tbody>

                    </table>
                </div>

            </div>
        </div>
    </section>

<script src="Script/adminApi.js"></script>
