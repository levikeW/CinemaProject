<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="Cinema.css"/>
    <title>Profil</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <a class="navbar-brand" href="Cinema.html">
                <img src="Logo.png" alt="Logo" height="50">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCinema">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCinema">
                <form class="d-flex ms-3">
                    <input class="form-control me-2" type="search" placeholder="Keresés">
                    <button class="btn btn-outline-success" type="submit">Keresés</button>
                </form>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="Cinema.html">Főoldal</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="container py-5" id="profileContainer">
        <h1>Profil</h1>
        <div id="profileInfo">
            <p><strong>Email:</strong> <span id="profEmail"></span></p>
            <p><strong>Teljes név:</strong> <span id="profFullName"></span></p>
            <p><strong>Számlázási cím:</strong> <span id="profBilling"></span></p>
        </div>
        <button class="btn btn-secondary" onclick="handleLogout();">Kijelentkezés</button>
    </div>

    <footer class="mt-5">
        &copy; 2025 Filmes oldal
    </footer>

    <script src="Script/cinema.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await fetchCurrentUser();
            if (!user) {
                window.location.href = 'Cinema.html';
                return;
            }
            document.getElementById('profEmail').textContent = user.email;
            document.getElementById('profFullName').textContent = user.fullName;
            document.getElementById('profBilling').textContent = user.billingAddress;
        });
    </script>
</body>
</html>
